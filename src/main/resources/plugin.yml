name: SellPlugin
version: 1.0
main: com.servidor.sell.SellPlugin
api-version: '1.21'
softdepend: [Vault]
commands:
  sell:
    description: Abre o menu de venda
    usage: /sell
    aliases: [vendermenu]
permissions:
