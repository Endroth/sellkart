# ===== SellPlugin =====
# Dinheiro: usa o Vault (se o seu plugin de economia estiver ligado ao Vault).
# Se NÃO tiver Vault, usa o comando abaixo, executado pelo console.
# Placeholders: {player} e {amount}
fallback-command: "eco give {player} {amount}"

# Vende automaticamente ao fechar o menu com ESC
sell-on-close: true

# Preço dos itens que NÃO estão na lista "prices" (0 = não vende).
default-price: 1

# Preços especiais (dependem de encantamento)
special:
  bow: 100
  bow-flame: 12000
  crossbow: 100
  crossbow-quick-charge: 10000

# Itens que nunca vendem. "*_CARPET" = qualquer item terminando em _CARPET
blocked:
  - "*RAIL"
  - "*_CARPET"
  - "*SPAWN_EGG"
  - "*SHULKER_BOX"
  - BUNDLE
  - BEDROCK
  - BARRIER
  - LIGHT
  - STRUCTURE_VOID
  - STRUCTURE_BLOCK
  - JIGSAW
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - REINFORCED_DEEPSLATE
  - SPAWNER
  - TRIAL_SPAWNER
  - VAULT
  - END_PORTAL_FRAME
  - PETRIFIED_OAK_SLAB
  - FARMLAND
  - DIRT_PATH

